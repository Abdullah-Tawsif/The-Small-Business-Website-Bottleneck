name: Quality checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/agencyforge-ci.sqlite
      JWT_SECRET_KEY: ci-only-signing-secret-material-with-more-than-32-bytes
      OPENAI_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify a clean migration target
        run: |
          rm -f /tmp/agencyforge-ci.sqlite
          alembic upgrade head
          alembic check
      - name: Run tests
        run: python -m pytest -q
