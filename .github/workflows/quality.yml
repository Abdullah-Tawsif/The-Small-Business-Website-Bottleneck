name: Quality checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agencyforge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agencyforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyforge -d agencyforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: sqlite:////tmp/agencyforge-ci.sqlite
      JWT_SECRET_KEY: ci-only-signing-secret-material-with-more-than-32-bytes
      OPENAI_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
      AGENCYFORGE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      AGENCYFORGE_TEST_POSTGRES_URL: postgresql+psycopg://agencyforge:ci-only-password@127.0.0.1:5432/agencyforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify a clean migration target
        run: |
          rm -f /tmp/agencyforge-ci.sqlite
          alembic upgrade head
          alembic check
      - name: Run tests
        run: python -m pytest -q

  migration-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      JWT_SECRET_KEY: ci-only-signing-secret-material-with-more-than-32-bytes
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run isolated migration safety suite
        run: python -m pytest -q tests/test_migrations.py

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: browser-suite-ci-signing-key-with-more-than-32-bytes
      AGENCYFORGE_RUN_BROWSER_TESTS: "1"
      AGENCYFORGE_SCREENSHOT_DIR: ${{ runner.temp }}/agencyforge-browser-screenshots
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run real browser workflows
        run: python -m pytest -q tests/e2e/test_browser_workflow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agencyforge-browser-screenshots
          path: ${{ runner.temp }}/agencyforge-browser-screenshots
