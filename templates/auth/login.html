<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — AgencyForge</title><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/auth/login.css"><link rel="stylesheet" href="/static/css/agencyforge-theme.css"><script src="/static/js/icons.js"></script></head>
<body class="auth-page"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><a class="back-home" href="/">← Back to home</a><main class="auth-shell"><div class="auth-card"><a class="brand auth-brand" href="/"><span class="brand-mark">A</span><span>AgencyForge</span></a><div class="auth-heading"><span class="section-kicker">Welcome back</span><h1>Good to see you <span>again.</span></h1><p>Sign in to pick up where you left off.</p></div>
<form class="auth-form" data-form="login" novalidate><label>Email address<input type="email" name="email" placeholder="you@company.com" autocomplete="email" required><span class="field-error"></span></label><label>Password<div class="password-field"><input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></div><span class="field-error"></span></label><div class="form-options"><span class="muted-link">Sign-in sessions expire automatically.</span><span class="muted-link" aria-disabled="true">Password recovery is not available yet.</span></div><button class="button button-full" type="submit">Sign in</button><div class="form-message" role="status"></div></form><p class="auth-switch">Don’t have an account? <a href="/register">Create one</a></p></div></main><script src="/static/js/main.js"></script></body></html>
