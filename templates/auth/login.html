<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — Scopewise</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/base.css"><script src="https://unpkg.com/lucide@latest"></script></head>
<body class="auth-page"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><a class="back-home" href="/">← Back to home</a><main class="auth-shell"><div class="auth-card"><a class="brand auth-brand" href="/"><span class="brand-mark">S</span><span>scopewise</span></a><div class="auth-heading"><span class="section-kicker">Welcome back</span><h1>Good to see you <span>again.</span></h1><p>Sign in to pick up where you left off.</p></div>
<form class="auth-form" data-form="login" novalidate><label>Email address<input type="email" name="email" placeholder="you@company.com" autocomplete="email" required><span class="field-error"></span></label><label>Password<div class="password-field"><input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></div><span class="field-error"></span></label><div class="form-options"><label class="check-label"><input type="checkbox" name="remember"><span>Remember me</span></label><a href="#" class="muted-link">Forgot password?</a></div><button class="button button-full" type="submit">Sign in</button><div class="form-message" role="status"></div></form><p class="auth-switch">Don’t have an account? <a href="/register">Create one</a></p></div></main><script src="/static/js/main.js"></script></body></html>
