<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — AgencyForge</title><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/auth/register.css"><link rel="stylesheet" href="/static/css/agencyforge-theme.css"><script src="/static/js/icons.js"></script></head>
<body class="auth-page"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><a class="back-home" href="/">← Back to home</a><main class="auth-shell"><div class="auth-card register-card"><a class="brand auth-brand" href="/"><span class="brand-mark">A</span><span>AgencyForge</span></a><div class="auth-heading"><span class="section-kicker">Start with clarity</span><h1>Create your <span>account.</span></h1><p>Set up your workspace and make the next step easier.</p></div>
<form class="auth-form" data-form="register" novalidate><label>Full name<input type="text" name="name" placeholder="Alex Morgan" autocomplete="name" required><span class="field-error"></span></label><label>Email address<input type="email" name="email" placeholder="you@company.com" autocomplete="email" required><span class="field-error"></span></label><label>Password<div class="password-field"><input type="password" name="password" placeholder="Create a password" autocomplete="new-password" required minlength="10"><button type="button" class="password-toggle" aria-label="Show password">Show</button></div><span class="field-hint">Use at least 10 characters.</span><span class="field-error"></span></label><label>Confirm password<div class="password-field"><input type="password" name="confirm" placeholder="Repeat your password" autocomplete="new-password" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></div><span class="match-message"></span><span class="field-error"></span></label><button class="button button-full" type="submit">Create account</button><div class="form-message" role="status"></div></form><p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p></div></main><script src="/static/js/main.js"></script></body></html>
